[project]
name = "auto-daybook"
version = "0.1.0"
description = "Local screen notes and declarative skills"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "httpx", "pydantic>=2", "pyyaml", "mss", "python-xlib", "pillow", "PySide6-Essentials"]

[project.scripts]
daybook = "daybook.app:main"

[dependency-groups]
dev = ["ruff", "pyright", "pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daybook"]

[tool.ruff]
target-version = "py312"
# Historical sketches and already-shipped machine setup are separate projects.
extend-exclude = ["docs/planning", "scripts/gx10"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src", "scripts/check_boundaries.py", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
